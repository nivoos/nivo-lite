key: demo.payment
start: remember
steps:
  ask:
    accounts:
      - sepay
    cell:
      key: demo.ask-to-pay
      kind: node
      version: 1
    input:
      orderId:
        $ref: trigger.data.orderId
      total:
        $ref: trigger.data.total
    kind: node
    mode: auto
    next: wait
  match:
    kind: core.if
    label:
      en: Paid in full?
      vi: Đủ tiền?
    no: ask
    when:
      op: gte
      ref:
        $ref: vars.paidAmount
      value:
        $ref: trigger.data.total
    yes: paid
  paid:
    config:
      name: paid
      output:
        amountVnd:
          $ref: vars.paidAmount
        payKey:
          $ref: steps.ask.output.payKey
    kind: core.outcome
  remember:
    config:
      next: match
      set:
        paidAmount:
          $ref: trigger.data.amountVnd
    kind: core.set
  unpaid:
    config:
      name: unpaid
    kind: core.outcome
  wait:
    config:
      keys:
        - verb: nivo.trigger.payment.credit.received
          where:
            op: present
            ref:
              $ref: trigger.data.creditId
      next: paid
      onTimeout: unpaid
      timeout:
        hours: 24
    kind: core.wait
triggers:
  - accounts:
      - sepay
    verb: nivo.trigger.payment.credit.received
vars:
  paidAmount:
    schema:
      type: number
version: 1
