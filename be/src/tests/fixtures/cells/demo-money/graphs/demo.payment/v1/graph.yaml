key: demo.payment
version: 1
start: remember
triggers:
  - { verb: nivo.trigger.payment.credit.received, accounts: [sepay] }
vars:
  paidAmount: { schema: { type: number } }
steps:
  remember:
    kind: core.set
    config:
      set: { paidAmount: { $ref: trigger.data.amountVnd } }
      next: match
  match:
    kind: core.if
    label: { vi: "Đủ tiền?", en: "Paid in full?" }
    when: { op: gte, ref: { $ref: vars.paidAmount }, value: { $ref: trigger.data.total } }
    yes: paid
    no: ask
  ask:
    kind: node
    cell: { kind: node, key: demo.ask-to-pay, version: 1 }
    input: { orderId: { $ref: trigger.data.orderId }, total: { $ref: trigger.data.total } }
    mode: auto
    accounts: [sepay]
    next: wait
  wait:
    kind: core.wait
    config:
      keys:
        - { verb: nivo.trigger.payment.credit.received, where: { op: present, ref: { $ref: trigger.data.creditId } } }
      timeout: { hours: 24 }
      next: paid
      onTimeout: unpaid
  paid:
    kind: core.outcome
    config: { name: paid, output: { payKey: { $ref: steps.ask.output.payKey }, amountVnd: { $ref: vars.paidAmount } } }
  unpaid:
    kind: core.outcome
    config: { name: unpaid }
