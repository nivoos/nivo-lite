body:
  accounts:
    - sepay
    - payos
  mode: auto
examples:
  - expect:
      ok:
        payKey: DH1001
    input:
      orderId: DH1001
      total: 350000
    name: asks 350,000 for DH1001
    tools:
      - answer:
          ok: true
          value:
            payKey: DH1001
        id: nivo.tool.payment.request.create
      - answer:
          ok: true
          value:
            delivered: true
        id: nivo.tool.customer.message.send
  - expect:
      ending: cannot
    input:
      orderId: DH1002
      total: 0
    name: cannot when the request is refused
    tools:
      - answer:
          ok: false
          refusal: amount_invalid
        id: nivo.tool.payment.request.create
input:
  properties:
    orderId:
      type: string
    total:
      type: number
  required:
    - orderId
    - total
  type: object
key: demo.ask-to-pay
kind: node
origin: run.ts
output:
  properties:
    payKey:
      type: string
  required:
    - payKey
  type: object
semantics:
  mutates: false
  tools:
    - nivo.tool.payment.request.create
    - nivo.tool.customer.message.send
source: run.js
title:
  en: Ask the customer to pay
  vi: Mời khách thanh toán
version: 1
