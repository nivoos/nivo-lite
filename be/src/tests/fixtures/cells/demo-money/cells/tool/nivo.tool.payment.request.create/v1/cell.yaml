body:
  account: owner
  servedBy:
    sepay: nivo.api.sepay.payment.create
input:
  properties:
    amountVnd:
      minimum: 1
      type: integer
    reference:
      type: string
  required:
    - amountVnd
    - reference
  type: object
key: nivo.tool.payment.request.create
kind: tool
output:
  properties:
    payKey:
      type: string
  required:
    - payKey
  type: object
semantics:
  confirmBy:
    args:
      payKey:
        from: args
        member: reference
    happened:
      equals: true
      member: found
    tool: nivo.tool.payment.request.read
  finalRefusals:
    - account_closed
  mutates: true
  onceBy:
    - reference
  outside: true
  refusals:
    - amount_invalid
    - account_closed
  repeatable: false
title:
  en: Create a payment request
  vi: Tạo yêu cầu thanh toán
version: 1
