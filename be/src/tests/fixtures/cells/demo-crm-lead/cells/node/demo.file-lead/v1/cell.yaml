body:
  accounts:
    - demo-crm
  mode: auto
examples:
  - expect:
      ok:
        leadId: L1
    input:
      email: lan@example.test
      name: Lan
      recordId: R1
    name: files Lan and updates the record
    tools:
      - answer:
          ok: true
          value:
            text: Lan wants a quote
        id: demo.model.complete
      - answer:
          ok: true
          value:
            leadId: L1
        id: nivo.tool.crm.lead.create
      - answer:
          ok: true
          value:
            updated: true
        id: nivo.tool.record.update
  - expect:
      ending: cannot
    input:
      email: bad
      name: ""
      recordId: R2
    name: cannot when the CRM refuses the lead
    tools:
      - answer:
          ok: true
          value:
            text: ""
        id: demo.model.complete
      - answer:
          ok: false
          refusal: invalid_lead
        id: nivo.tool.crm.lead.create
input:
  properties:
    email:
      type: string
    name:
      type: string
    recordId:
      type: string
  required:
    - recordId
    - name
    - email
  type: object
key: demo.file-lead
kind: node
origin: run.ts
output:
  properties:
    leadId:
      type: string
  required:
    - leadId
  type: object
semantics:
  mutates: false
  tools:
    - demo.model.complete
    - nivo.tool.crm.lead.create
    - nivo.tool.record.update
source: run.js
title:
  en: File one lead
  vi: Ghi một lead
version: 1
