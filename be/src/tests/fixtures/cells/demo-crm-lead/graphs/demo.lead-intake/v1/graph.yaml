key: demo.lead-intake
start: each
steps:
  done:
    config:
      name: filed
    kind: core.outcome
  each:
    config:
      body:
        start: file
        steps:
          file:
            accounts:
              - demo-crm
            cell:
              key: demo.file-lead
              kind: node
              version: 1
            input:
              email:
                $ref: item.email
              name:
                $ref: item.name
              recordId:
                $ref: item.recordId
            kind: node
            mode: auto
      concurrency: 1
      key: email
      max: 50
      next: done
      over:
        $ref: trigger.data.leads
    kind: core.loop
triggers:
  - accounts:
      - demo-crm
    verb: nivo.trigger.crm.leads.received
version: 1
