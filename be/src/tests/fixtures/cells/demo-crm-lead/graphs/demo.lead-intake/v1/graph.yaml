key: demo.lead-intake
version: 1
start: each
triggers:
  - { verb: nivo.trigger.crm.leads.received, accounts: [demo-crm] }
steps:
  each:
    kind: core.loop
    config:
      over: { $ref: trigger.data.leads }
      key: email
      max: 50
      concurrency: 1
      body:
        start: file
        steps:
          file:
            kind: node
            cell: { kind: node, key: demo.file-lead, version: 1 }
            input:
              recordId: { $ref: item.recordId }
              name: { $ref: item.name }
              email: { $ref: item.email }
            mode: auto
            accounts: [demo-crm]
      next: done
  done:
    kind: core.outcome
    config: { name: filed }
