schema: starci/seeds@1
entries:
  # The SEED STANDARDS (owner R98, R101-R106; PROD-WIRE 2026-11-15): one `<name>-seed-standard` repository = ONE complete workspace, pinned by a
  # PUSHED commit, applied ONCE through the app's own doors (`seed-standard apply`: its receipt in public.workspace_seed_receipts skips it whole
  # on every later run; a new pin is only reported; `force: true` re-seeds once per pinned commit, keeping relations). They replace the old
  # management seed (`nivo-workspace`) and the enterprise seed of production: the NIVO Web standard sets the enterprise identifier itself.
  # The workspaces' owner is the address of `owner` (the sealed member seeds-nivo-workspace, key WORKSPACE_OWNER_EMAIL): found or made through
  # the owners door (no usable password; he signs in with Google, which links by the verified address).
  # Production runs it by the ONE-SHOT route `node scripts/seed-standards-oneshot.mjs --env production --execute` (the standard materialised on the
  # operator's machine by @starci/seed/git with the production identity, handed on stdin to this command in the running nivo-api task): the api
  # image holds no git, sops or identity, so the command run by a deploy's seed step only finds each receipt and answers `unchanged`.
  - id: seed-standards
    kind: data
    path: data/seed-standards
    target: [node, be/dist/apps/cli/src/main.js, seed-standard, apply, --env, production]
    mode: always
    schema: be/src/modules/domain/workspace-seed/seed-standard.schema.json
