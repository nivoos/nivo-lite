# Generated by starci app sync (app root). Do not edit: run "npx starci app sync --execute".
# The be unit run's lcov (be/coverage/lcov.info), uploaded by the managed CI workflow. Coverage is the logic of be/src/modules/**: the status
# paths are the measured roots of the one coverage scope (derived from the slot manifest's `coverage` field; its complement is shared by ignore and
# sonar.coverage.exclusions and its roots by be/jest.config.js), held at 100 on the project and on the patch, and each component (one per
# service app, plus platform, plus one per root workspace package) is held at 100 too. fe/ and be/src/features are outside coverage (features are thin by rule; a front end has no tests).
codecov:
  require_ci_to_pass: true
coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
        paths:
          - "be/src/modules/domain/*/**"
          - "be/src/modules/integrations/*/**"
          - "be/src/modules/platform/*/**"
          - "be/src/modules/projections/*/**"
          - "packages/agent-sdk/src/**"
          - "packages/blocks-core/src/**"
          - "packages/nivo-gtm/src/**"
          - "packages/nivo-web-core/src/**"
          - "packages/plugin-registry/src/**"
    patch:
      default:
        target: 100%
        threshold: 0%
        paths:
          - "be/src/modules/domain/*/**"
          - "be/src/modules/integrations/*/**"
          - "be/src/modules/platform/*/**"
          - "be/src/modules/projections/*/**"
          - "packages/agent-sdk/src/**"
          - "packages/blocks-core/src/**"
          - "packages/nivo-gtm/src/**"
          - "packages/nivo-web-core/src/**"
          - "packages/plugin-registry/src/**"
